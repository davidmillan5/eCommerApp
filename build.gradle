plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.26.0'
}

group = 'com.grid'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

openApiGenerate {
	generatorName = 'spring'
	inputSpec = "$rootDir/src/main/resources/api/openapi.yaml"
	outputDir = "$buildDir/generated/openapi"

	apiPackage = 'com.grid.estore.api'
	modelPackage = 'com.grid.estore.model'

	configFile = "$rootDir/src/main/resources/api/config.json"

	typeMappings = [
			URI: 'URI'
	]

	importMappings = [
			URI: 'java.net.URI'
	]

	ignoreFileOverride = "$rootDir/src/main/resources/api/.openapi-generator-ignore"
}

sourceSets {
	main {
		java {
			srcDir "$buildDir/generated/openapi/src/main/java"
		}
	}
}

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
}

tasks.named('processResources') {
	dependsOn tasks.named('openApiGenerate')
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'io.swagger.core.v3:swagger-models:2.2.54'
	compileOnly 'io.swagger.core.v3:swagger-annotations:2.2.54'
	implementation 'org.springframework.boot:spring-boot-starter-validation:4.1.1'
	implementation 'org.openapitools:jackson-databind-nullable:0.2.12'

	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.22.3'
	implementation 'org.springframework.boot:spring-boot-starter-hateoas:4.1.1'

	//implementation 'io.springfox:springfox-oas:3.0.0'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


springBoot {
	mainClass = 'com.grid.eCommerce.ECommerceApplication'
}


tasks.named('test') {
	useJUnitPlatform()
}
